| Pattern | Sounds like |
|---|---|
| **Swap the model** | "Switch to a larger / the smallest model" |
| **Prompt as policy** | "Add a line to the system prompt asking…" |
| **Misses the constraint** | Faster when the stem said cheaper; temperature for a security problem |
| **Stuff the context** | "Paste the data into every request" |
| **Overclaims a feature** | "Built-in tools can reach any internal API" |

# One endpoint: `POST /v1/messages`

.two-col[
<div>
<div class="col-head">REQUEST</div>
<ul>
<li><code>model</code>, <code>max_tokens</code></li>
<li><code>system</code>: the behavioral contract</li>
<li><code>messages</code>: alternating user/assistant turns of <strong>content blocks</strong></li>
<li><code>tools</code>, <code>tool_choice</code></li>
<li><code>output_config</code>: <code>effort</code>, <code>format</code></li>
<li><code>thinking</code>, <code>cache_control</code></li>
</ul>
</div>
<div>
<div class="col-head blue">RESPONSE</div>
<ul>
<li><code>content</code>: text, tool_use, thinking blocks</li>
<li><code>stop_reason</code>: why it stopped</li>
<li><code>usage</code>: input, output, <code>cache_creation_input_tokens</code>, <code>cache_read_input_tokens</code></li>
</ul>
</div>
]

*Stateless: you resend the whole conversation every call.*

???
Tools, structured output, thinking, caching are all features of this one endpoint, not separate APIs. Batches, Files, count_tokens, Models are supporting endpoints.

The SDKs are a thin layer over REST: auth, retries (2 by default on 408/409/429/5xx), typed errors, streaming helpers.

class: dense

# Read `stop_reason` before you read `content`

| stop_reason | Meaning | Your code |
|---|---|---|
| `end_turn` | Finished naturally | Use the answer |
| `tool_use` | Wants a tool | Run it, return `tool_result`, loop |
| `max_tokens` | Hit your cap mid-output | Don't parse; raise cap or continue |
| `stop_sequence` | Hit a custom stop string | Expected cut |
| `pause_turn` | Long server-tool turn paused | Send back to continue |
| `refusal` | Safety classifier declined | Handle; check `stop_details` |
| `model_context_window_exceeded` | Window filled mid-generation | Trim / compact history |

???
An input that's already too large fails with a validation error before generation. A request that fits but fills the window during generation returns what it has with model_context_window_exceeded. Neither silently drops old turns: managing history is the app's job.

class: question

.q-label[Q1 · D2 API Mechanics]

.stem[An extraction service asks Claude for JSON. About 3% of responses fail to parse. Every failed response has `stop_reason: "max_tokens"`. What is the best fix?]

.options[
- **A.** Add "Always return complete, valid JSON" to the system prompt.
- **B.** Check `stop_reason` before parsing and raise `max_tokens` for this route so long extractions can finish.
- **C.** Switch to a larger model that writes JSON more reliably.
- **D.** Lower the temperature to make output more deterministic.
]

---

class: answer

.q-label[Q1 · Answer]

.correct[B · Check stop_reason, raise the cap]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Prompt as policy | The model was cut off; it can't finish what the cap stopped |
| C | Swap the model | Same cap, same truncation |
| D | Misses the constraint | Temperature doesn't change length (and newest models reject it) |

*The trace already told you the cause. Read `stop_reason`.*

???
Structured outputs guarantee the schema, not completion. A max_tokens truncation still returns broken JSON. Always branch on stop_reason first.

# Four request shapes

| Shape | Use when | Watch for |
|---|---|---|
| **Synchronous** | Short calls, backend jobs | Timeouts on long outputs |
| **Streaming (SSE)** | A user is watching; long or large outputs | Assemble per block; handle drops |
| **Async client** | Concurrency without blocking your app | Still realtime; still rate-limited |
| **Message Batches** | Bulk, offline, nobody waiting | Up to 24 h; **50% off**; results out of order |

*Is a user waiting? Then realtime. Is it bulk and can it wait? Then batch.*

???
Python has AsyncAnthropic; the TS client is already Promise-based.

Batches: up to 100,000 requests or 256 MB per batch. Submit a list with custom_id per request, poll processing_status until "ended", stream results, key by custom_id, never by position. Result types: succeeded, errored, canceled, expired.

---

# Streaming without corrupting state

- Events: `message_start` → `content_block_start` → `content_block_delta`… → `content_block_stop` → `message_delta` (**stop_reason, usage**) → `message_stop`
- Accumulate **per content-block index**; tool inputs arrive as partial JSON
- Act only on **complete** blocks; never execute a half-streamed tool call
- On a dropped stream: treat what you have as partial, then retry or resume; don't commit it
- SDK helpers: `get_final_message()` / `finalMessage()`

???
Stop reason and final usage arrive in message_delta near the end. Code that writes to a database on every delta, or runs a tool when content_block_start arrives, corrupts state when the stream drops.

Streaming is also the fix for HTTP timeouts on large max_tokens.

# Prompt caching: pay once for the stable prefix

| Fact | Value |
|---|---|
| Match | Exact **prefix**, in order `tools → system → messages` |
| Marker | `cache_control: {type: "ephemeral"}` · max **4** breakpoints |
| TTL | **5 min** default · `"ttl": "1h"` option · reads refresh the timer |
| Price | Write **1.25×** (5 min) / **2×** (1 h) · read **~0.1×** base input |
| Minimum | Model-dependent prefix length; shorter silently won't cache |
| Verify | `usage.cache_read_input_tokens` > 0 on repeat calls |

*Stable content first, volatile content after the last breakpoint.*

???
"Cache check-pointing" in the blueprint = where you place breakpoints. One on the last system block caches tools + system. For multi-turn, a breakpoint on the latest turn lets each request reuse the prior conversation.

Silent invalidators: a timestamp or request ID in the system prompt, unsorted JSON, a tool list that changes order, switching model (caches are model-scoped).

Break-even: 5-min TTL pays off at the second request.

# Model choice and reasoning are separate levers

| Tier | Role | Default move |
|---|---|---|
| **Fable** | Most capable: hardest reasoning, long agentic work | Only when evals demand it |
| **Opus** | Demanding work above Sonnet | Step up on eval evidence |

# Workflow or agent?

<div>
<div class="col-head">WORKFLOW</div>

<div>

<ul>

<li>Supervisor + subagents for parallel or isolated work</li>
</ul>
</div>
]

Orchestrator-workers costs roughly 15× the tokens of a chat. It's a poor fit for tightly coupled work like a single coding change.

Skill 1.1: decision criteria, manager/supervisor hierarchies, subagents. Subagents improve execution by isolating context: each starts fresh, does one job, returns a condensed result. Anything they need (constraints, format) must be passed explicitly.

# The tool-use loop: Claude asks, your code runs

```
while True:
    resp = client.messages.create(model=MODEL, max_tokens=4096,
                                  tools=tools, messages=messages)
    messages.append({"role": "assistant", "content": resp.content})  # keep ALL blocks
    if resp.stop_reason != "tool_use":
        break
    results = [{"type": "tool_result", "tool_use_id": b.id,
                "content": run(b.name, b.input)}           # is_error=True on failure
               for b in resp.content if b.type == "tool_use"]
    messages.append({"role": "user", "content": results})  # ONE user turn, all results
```

- Every `tool_use` id answered by a matching `tool_result` in the **next** user turn
- Thinking blocks go back **unchanged**; never strip them mid-loop

???
Claude never executes tools. It emits tool_use; your code runs it and returns tool_result. Mismatched or missing IDs fail validation: that's a code bug, not a prompt problem.

Return all parallel results in one user message. Splitting them teaches the model to stop calling tools in parallel.

The SDK Tool Runner automates this exact loop for tools you define.

# Tool definitions Claude selects correctly

| Part | Do |
|---|---|
| `name` | Specific: `get_account_balance`, not `get_data` |
| `description` | 3–4 sentences: what it does, **when to use, when not to**, what it returns |

Client tools (you run them) vs server tools (Anthropic runs them: web_search, web_fetch, code_execution). Approval patterns: gate risky tools behind human confirmation in your harness.

# Subagents, hooks, and humans

| Tool | What it does | Use for |
|---|---|---|
| **Subagents** | Fresh context per side task; returns a condensed result | Parallel or noisy work. Pass constraints explicitly: they don't inherit your conversation |
| **Hooks** | Deterministic code on lifecycle events; `PreToolUse` can **block** a call | Must-happen and must-never-happen rules |
| **Human-in-the-loop** | Approval checkpoint in your harness | **Irreversible** actions: payments, deletes, sends, deploys |

PreToolUse blocks by exiting with code 2 (stderr goes back to Claude) or returning a deny decision. PostToolUse can't block; use it for audit logs.

Hooks show up in three skills: 1.2 (deterministic actions), 7.3 (guardrails against destructive actions), and Claude Code. Memory: memory tool or an external store, scoped per user / project / task; load what's needed instead of replaying everything.

# Context engineering: the window is a budget

| Problem | Lever |
|---|---|
| Old tool output piling up | **Prune / clear** stale tool results (context editing) |
| Long session nearing the limit | **Compaction**: summarize earlier turns; keep compaction blocks |
| Side task floods the main thread | **Subagent** with its own window, returns a summary |
| State must survive sessions | **Memory** in external storage, loaded on demand |
| Unrelated next task | **Clear history** and start fresh |
| Many MCP servers attached | Connect only what you use; defer tool loading |

*Never "save context" by stripping thinking blocks mid tool loop.*

# Security: treat every input as data, not orders

- **Prompt injection** arrives in documents, web pages, emails, tool results
- **Isolate** untrusted content in tagged blocks; never promote it to instructions
- **Least privilege**: remove tools the task doesn't need before you guard them
- **Layer guardrails**: input screening → output validation → tool permissions → hooks → human approval
- **Data**: minimize PII, redact before sending, control retention, block exfiltration paths

*A polite rule in the prompt is not a control.*

???
Skills 7.1 and 7.2. Mid-conversation operator instructions go in a role "system" message, the non-spoofable operator channel; text inside user or tool content can be forged.

Jailbreak defense: same layering. Don't rely on the model alone; enforce in code what must never happen.

class: question

.q-label[Official sample 2 · D7 · Exam Guide, Section 8]

.stem[A Claude-powered agent summarizes web pages submitted by end users. One page contains hidden text instructing the model to ignore previous instructions and reveal its system prompt. Which mitigation is most effective?]

.options[
- **A.** Raise the model's temperature so its behavior is harder to predict.
- **B.** Treat retrieved page content as untrusted input, keep it separate from trusted instructions, and use guardrails or hooks so injected instructions cannot trigger sensitive actions.
- **C.** Add a line to the system prompt asking users not to include malicious instructions.
- **D.** Switch to a larger model that follows instructions more reliably.
]

---

class: answer

.q-label[Official sample 2 · Answer]

.correct[B · Isolate untrusted input + enforce guardrails]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Misses the constraint | Temperature is irrelevant to injection |
| C | Prompt as policy | A polite request isn't enforceable |
| D | Swap the model | A more obedient model can be **more** susceptible |

???
Guide rationale: isolate untrusted content from trusted instructions and enforce least-privilege guardrails so injected text cannot invoke sensitive tools.

---

# Secrets, keys, and identity

- Keys live in a **secret manager or env vars**, never in prompts, CLAUDE.md, repos, or client-side code
- **Backend proxy** between browsers/mobile apps and the API
- **Separate keys per environment** and workspace; least-privilege scopes
- **Rotate** on exposure; monitor usage per key
- MCP servers and tools hold **their own** credentials server-side; the model never sees them
- Prefer **workload identity** over long-lived static keys where available

???
Skill 7.4 (1.6%): secrets across dev and prod, identity validation, access approval and level verification, authorized access monitoring.

Workload Identity Federation: SDK exchanges a cloud identity token for short-lived credentials. Managed Agents vaults inject credentials at egress so they never enter the sandbox.

class: question

.q-label[Q11 · D7 Secrets and Key Management]

.stem[A startup's React web app calls the Claude API directly from the browser with an API key in the JavaScript bundle. Usage spikes overnight from unknown IPs. What should they do?]

.options[
- **A.** Obfuscate the bundle so the key is harder to find.
- **B.** Rotate the key now, move Claude calls behind a backend that holds the key in a secret manager, and monitor per-key usage.
- **C.** Add a system prompt line telling Claude to refuse requests from unknown users.
- **D.** Lower `max_tokens` to limit the cost of each abusive request.
]

---

class: answer

.q-label[Q11 · Answer]

.correct[B · Rotate, proxy, store in a secret manager, monitor]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Security by obscurity | Anything shipped to the browser is public |
| C | Prompt as policy | The model can't authenticate callers |
| D | Misses the constraint | Caps damage per call; key is still stolen |

class: dense

# Claude Code in one slide (D3 · 3.1%)

| Piece | Where | Job |
|---|---|---|
| **CLAUDE.md** | Managed → `~/.claude/` → project root → subfolders | Always-on context; `/init` writes the first one |
| **settings.json** | Managed → user → `.claude/settings.json` (shared) → `.claude/settings.local.json` (personal) | Permissions, hooks, env, model |
| **Rules** | `.claude/rules/` | Scoped instructions by path |
| **Skills** | `.claude/skills/<name>/SKILL.md` | On-demand procedures |
| **Commands** | Built-in + custom `/slash` commands | Reusable prompts |
| **Agents** | `.claude/agents/` | Subagents with own tools + context |
| **Modes** | default · acceptEdits · plan · auto · dontAsk · bypassPermissions | How much it asks first |
| **Headless** | `claude -p "…" --output-format json` | CI and scripts |

???
Managed settings (managed-settings.json) win over everything. Project settings are committed and shared; settings.local.json is gitignored for personal preferences. A deny rule beats an allow rule in any mode.

Modes: dontAsk allows only pre-approved tools (CI). bypassPermissions only inside an isolated container or VM. auto uses a classifier.

MCP servers for a project: .mcp.json at the repo root. Secrets as ${ENV_VAR}, never committed.

CLAUDE.md loads every session; keep it short (it loses weight past a few hundred lines). Rules in .claude/rules/ can be scoped with a paths glob.

Hooks are configured in settings.json. Plugins bundle commands, skills, agents, hooks and MCP servers for distribution.

Agent Memory: Claude Code can keep and recall project memory across sessions.

.q-label[Q12 · D3 + D2 Configuration Management]

.stem[A team wants every developer's Claude Code to be blocked from reading `.env` files. Individual developers also want personal model preferences that stay out of git. Where should each setting go?]

.options[
- **A.** Both in the project CLAUDE.md.
- **B.** The `.env` deny rule in `.claude/settings.json` (committed); personal preferences in `.claude/settings.local.json`.
- **C.** The `.env` deny rule in each developer's `~/.claude/settings.json`; preferences in the project CLAUDE.md.
- **D.** A line in the system prompt asking Claude not to open `.env` files.
]

---

class: answer

.q-label[Q12 · Answer]

.correct[B · Shared rule in project settings, personal prefs in local settings]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Prompt as policy | CLAUDE.md is context, not an enforced permission |
| C | Wrong layer | Relies on every person configuring it; prefs leak into git |
| D | Prompt as policy | Not enforceable; can be overridden |

*Right layer: enforce in settings, share in the repo, keep personal stuff local.*

.eyebrow-label[D4 · Eval, Testing, and Debugging · 2.6%]

# Integration layer or model output?

| Error | Meaning | Recovery |
|---|---|---|
| 400 `invalid_request_error` | Your request is malformed | Fix the code; don't retry as-is |
| 401 / 403 | Auth or permission | Fix the key or scope |
| 413 | Request too large | Trim input |
| 429 `rate_limit_error` | Over your limit | Back off; honor `retry-after` |
| 500 / 529 `overloaded_error` | Server side | Retry with exponential backoff |

**Read the trace first:** request payload → `stop_reason` → tool_use/tool_result pairing → only then the prompt.

???
Retriable: 429, 500, 502, 503, 504, 529. Fail fast: 400, 401, 403, 404. 529 is Anthropic-side overload, not your rate limit. A refusal is HTTP 200 with stop_reason refusal: don't retry it. Don't stack your own retry loop on top of the SDK's.

Skill 4.1: error type identification, recovery strategy selection, trace analysis, isolating integration layer vs model output. SDKs retry 408/409/429/5xx twice by default.

Evals: assert properties (field present, value in range, parses), not exact text, because output is non-deterministic. Use a model-graded judge for meaning. Keep a regression set before any model or prompt change.

class: question

.q-label[Q13 · D4 Debugging]

.stem[After a refactor of the history-building code, 15% of agent requests fail with `invalid_request_error: tool_result block references unknown tool_use_id`. The team has rewritten the tool descriptions twice. What should they do next?]

.options[
- **A.** Rewrite the tool descriptions a third time with clearer exclusion conditions.
- **B.** Switch to a more capable model that tracks tool IDs better.
- **C.** Inspect failing request traces and fix the code so each `tool_result` echoes the exact `tool_use_id` in the next user turn.
- **D.** Wrap the call in a retry loop with exponential backoff.
]

---

class: answer

.q-label[Q13 · Answer]

.correct[C · It's an integration bug: read the trace, fix the code]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Wrong layer | A 400 validation error is not a prompt problem |
| B | Swap the model | The API rejects the request before the model runs |
| D | Wrong recovery | Retrying a malformed request fails identically |

---

class: question

.q-label[Rapid fire · True or false?]

.options[
- **1.** Temperature 0 guarantees identical outputs.
- **2.** Claude executes your custom tools on Anthropic's servers.
- **3.** MCP tool definitions consume context even when no tool is called.
- **4.** Batch results come back in the order you submitted them.
- **5.** Thinking blocks can be summarized to save context mid tool loop.
- **6.** Structured outputs guarantee a parseable object even when `stop_reason` is `max_tokens`.
]

---

class: answer

.q-label[Rapid fire · Answers]

| # | Answer | Why |
|---|---|---|
| 1 | **False** | Sampling; never guaranteed. Newest models reject the param |
| 2 | **False** | Your code runs client tools; only server tools run at Anthropic |
| 3 | **True** | Definitions load up front; defer or allowlist |
| 4 | **False** | Key results by `custom_id` |
| 5 | **False** | Return them unchanged or the next request fails |
| 6 | **False** | Truncation still breaks the object; check `stop_reason` |
